<script>
  const fonts = [
    {cls:&quot;f-vibes&quot;,     name:&quot;Great Vibes&quot;,       tag:&quot;Script&quot;,      g:&quot;Great+Vibes&quot;,       use:&quot;Romantic flowing calligraphy — a signature choice for names on pendants and outer bands.&quot;},

    {cls:&quot;f-playfair&quot;,  name:&quot;Playfair Display&quot;,  tag:&quot;Serif&quot;,       g:&quot;Playfair+Display&quot;,  use:&quot;Elegant contrast with a modern edge; balanced for names and initials.&quot;},
    {cls:&quot;f-josefin&quot;,   name:&quot;Josefin Sans&quot;,      tag:&quot;Modern&quot;,      g:&quot;Josefin+Sans&quot;,      use:&quot;Geometric and minimal with an art-deco air; unisex and contemporary.&quot;},

    {cls:&quot;f-alexbrush&quot;, name:&quot;Alex Brush&quot;,        tag:&quot;Brush Script&quot;,g:&quot;Alex+Brush&quot;,        use:&quot;Expressive brush signature; flowing and confident for names.&quot;},
    {cls:&quot;f-parisienne&quot;,name:&quot;Parisienne&quot;,        tag:&quot;Casual Script&quot;,g:&quot;Parisienne&quot;,       use:&quot;Soft, feminine hand — friendly and personal on delicate pieces.&quot;},

  const grid = document.getElementById(&quot;grid&quot;);
  const inputs = [&quot;initials&quot;,&quot;line2&quot;,&quot;line3&quot;].map(id => document.getElementById(id));
  const cards = [];

  fonts.forEach((f,idx) => {
    const num = String(idx+1).padStart(2,&quot;0&quot;);
    const card = document.createElement(&quot;article&quot;);
    card.className = &quot;card&quot;;
    card.innerHTML =
      '<div class=&quot;plate&quot;><span class=&quot;idx&quot;>'+num+'</span><span class=&quot;sample '+f.cls+'&quot;>'+

      '</span></div>'+
      '<div class=&quot;meta&quot;><div class=&quot;meta-top&quot;>'+

        '<span class=&quot;tag&quot;>'+f.tag+'</span></div>'+
        '<p class=&quot;use&quot;>'+f.use+'</p>'+
        '<div class=&quot;actions&quot;>'+
          '<button type=&quot;button&quot; class=&quot;btn primary dl&quot;>⬇ Save PNG</button>'+
          '<a class=&quot;btn&quot; href=&quot;https://fonts.google.com/specimen/'+f.g+'&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>Get font ↗</a>'+
        '</div></div>';
    grid.appendChild(card);
    const sample = card.querySelector(&quot;.sample&quot;);
    cards.push([
      card.querySelector(&quot;.l1&quot;),
      card.querySelector(&quot;.l2&quot;),

    const S = 3, W = 1100 * S, padY = 80 * S;

        y+=size; ctx.fillText(txt,W/2,y); y+=size*0.34;
      });
      c.toBlob(b=>triggerDownload(b,&quot;REIA-&quot;+f.name.replace(/[^a-z0-9]+/gi,&quot;-&quot;)+&quot;.png&quot;),&quot;image/png&quot;);
    });
  }

  // Save the whole comparison table as one PNG.
  $(&quot;dlsheet&quot;).addEventListener(&quot;click&quot;,()=>{
    const btn=$(&quot;dlsheet&quot;), table=$(&quot;matrix&quot;);
    if(typeof html2canvas!==&quot;function&quot;){ alert(&quot;Image library still loading — try again in a moment.&quot;); return; }
    btn.disabled=true; const label=btn.textContent; btn.textContent=&quot;Rendering…&quot;;
    const bg=getComputedStyle(document.body).backgroundColor;
    document.fonts.ready.then(()=>html2canvas(table,{backgroundColor:bg,scale:2,windowWidth:table.scrollWidth}))
      .then(canvas=>canvas.toBlob(b=>{ triggerDownload(b,&quot;REIA-font-comparison.png&quot;); btn.disabled=false; btn.textContent=label; },&quot;image/png&quot;))
      .catch(()=>{ btn.disabled=false; btn.textContent=label; alert(&quot;Could not render the image. Try fewer samples/fonts.&quot;); });
  });

  build();
</script>
"></iframe>
</main>

<script>
  const tabs={book:document.getElementById("tab-book"),bench:document.getElementById("tab-bench")};
  const frames={book:document.getElementById("frame-book"),bench:document.getElementById("frame-bench")};
  function show(v){
    for(const k in frames){
      const on=k===v;
      frames[k].hidden=!on;
      tabs[k].setAttribute("aria-selected",on?"true":"false");
    }
    try{history.replaceState(null,"","#"+v);}catch(e){}
  }
  tabs.book.onclick=()=>show("book");
  tabs.bench.onclick=()=>show("bench");
  if(location.hash==="#bench")show("bench");
</script>
